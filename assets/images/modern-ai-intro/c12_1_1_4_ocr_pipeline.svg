<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de OCR y reutilización del texto</title>
  <desc id="desc">Diagrama de reconocimiento óptico de caracteres desde una imagen con texto hasta salida editable o traducida.</desc>
  <foreignObject x="0" y="0" width="1200" height="940">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; }
        .page {
          width: 1200px;
          height: 940px;
          padding: 36px;
          background: linear-gradient(135deg, #eef2ff 0%, #f8fbff 52%, #fdf5ea 100%);
          font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .frame {
          height: 100%;
          padding: 32px 36px;
          border-radius: 30px;
          border: 3px solid #d8e0f0;
          background: rgba(255,255,255,0.96);
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        h1, h2, p { margin: 0; }
        h1 {
          color: #1c2c52;
          font-size: 42px;
          line-height: 1.05;
        }
        .lead {
          color: #55657f;
          font-size: 19px;
          line-height: 1.36;
          font-weight: 600;
          max-width: 1020px;
        }
        .flow {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 18px;
        }
        .card {
          padding: 20px;
          border-radius: 24px;
          border: 2px solid;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .scan { background: #eef8f9; border-color: #c3dde0; }
        .read { background: #eef2ff; border-color: #cad3f2; }
        .use { background: #fff5ea; border-color: #e6cfb1; }
        .thumb {
          height: 170px;
          border-radius: 18px;
          overflow: hidden;
          position: relative;
          background: #fff;
          border: 2px solid rgba(31, 48, 78, 0.09);
        }
        .paper {
          position: absolute;
          left: 48px;
          top: 16px;
          width: 196px;
          height: 138px;
          background: #fcfdff;
          border: 3px solid #d9dfef;
          border-radius: 18px;
          transform: rotate(-4deg);
        }
        .paper::before, .paper::after {
          content: "";
          position: absolute;
          left: 18px;
          right: 18px;
          height: 9px;
          background: #b2bed8;
          border-radius: 999px;
        }
        .paper::before { top: 32px; }
        .paper::after { top: 60px; }
        .line3 {
          position: absolute;
          left: 68px;
          top: 104px;
          width: 156px;
          height: 9px;
          background: #b2bed8;
          border-radius: 999px;
          transform: rotate(-4deg);
        }
        .box {
          position: absolute;
          border: 4px solid #2c7c8f;
          border-radius: 10px;
        }
        .b1 { left: 58px; top: 36px; width: 170px; height: 24px; transform: rotate(-4deg); }
        .b2 { left: 64px; top: 64px; width: 136px; height: 24px; transform: rotate(-4deg); }
        .b3 { left: 72px; top: 94px; width: 160px; height: 24px; transform: rotate(-4deg); }
        .codes {
          position: absolute;
          inset: 18px;
          display: grid;
          align-content: center;
          gap: 8px;
        }
        .row {
          padding: 10px 12px;
          border-radius: 14px;
          background: #f6f8ff;
          border: 2px solid rgba(49, 72, 113, 0.12);
          color: #304465;
          font-size: 18px;
          font-weight: 800;
          letter-spacing: 0.04em;
        }
        .resultBox {
          position: absolute;
          inset: 18px;
          display: grid;
          gap: 10px;
        }
        .resultLine {
          padding: 10px 12px;
          border-radius: 14px;
          background: #fff;
          border: 2px solid rgba(31, 48, 78, 0.1);
          color: #384d69;
          font-size: 16px;
          font-weight: 700;
        }
        .resultLine strong {
          color: #1f3153;
        }
        .card h2 {
          color: #203253;
          font-size: 27px;
        }
        .card p {
          color: #51637c;
          font-size: 17px;
          line-height: 1.38;
          font-weight: 600;
        }
        .footer {
          margin-top: auto;
          padding: 18px 22px;
          border-radius: 24px;
          background: #203052;
          color: #fff;
        }
        .footer h2 {
          font-size: 24px;
          margin-bottom: 8px;
        }
        .footer p {
          color: #edf2ff;
          font-size: 17px;
          line-height: 1.36;
          font-weight: 600;
        }
      </style>
      <div class="frame">
        <h1>Leer texto en una imagen también es visión artificial</h1>
        <p class="lead">El OCR localiza dónde aparecen caracteres, los reconoce uno por uno y convierte la imagen en texto reutilizable. Después ese texto puede copiarse, buscarse, resumirse o traducirse.</p>
        <div class="flow">
          <div class="card scan">
            <div class="thumb">
              <div class="paper"></div>
              <div class="line3"></div>
              <div class="box b1"></div>
              <div class="box b2"></div>
              <div class="box b3"></div>
            </div>
            <h2>1. Detectar</h2>
            <p>El sistema identifica regiones donde parece haber texto. Esa parte se parece a la detección de objetos: primero encuentra dónde está la información.</p>
          </div>
          <div class="card read">
            <div class="thumb">
              <div class="codes">
                <div class="row">H O L L Y</div>
                <div class="row">W A L K</div>
                <div class="row">O F  F A M E</div>
              </div>
            </div>
            <h2>2. Reconocer</h2>
            <p>Cada bloque se clasifica como letra, número o símbolo. Si el texto está curvado, cortado o mal alineado, la lectura puede fallar o salir incompleta.</p>
          </div>
          <div class="card use">
            <div class="thumb">
              <div class="resultBox">
                <div class="resultLine"><strong>copiar:</strong> enviar el texto en un mensaje</div>
                <div class="resultLine"><strong>buscar:</strong> reutilizar nombres, precios o direcciones</div>
                <div class="resultLine"><strong>traducir:</strong> superponer una versión en otro idioma</div>
              </div>
            </div>
            <h2>3. Reutilizar</h2>
            <p>Una vez extraído, el texto puede moverse a otra aplicación o combinarse con traducción automática para trabajar carteles, recibos o documentos fotografiados.</p>
          </div>
        </div>
        <div class="footer">
          <h2>Idea central</h2>
          <p>El OCR convierte una imagen en una fuente de texto accionable, pero el usuario sigue validando si la lectura tiene sentido, sobre todo cuando la disposición visual del texto sale de lo habitual.</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
