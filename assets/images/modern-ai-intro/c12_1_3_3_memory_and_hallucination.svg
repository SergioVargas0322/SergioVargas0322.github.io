<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: alucinación y memoria conversacional</title>
  <desc id="desc">Infografía sobre respuestas plausibles pero falsas, arrastre del contexto reciente y señales para revisar una salida de chatbot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 940px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .top-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .panel {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 280px;
    }
    .hall { background: #fff5ea; border: 2px solid #efc89b; }
    .memory { background: #f3f0ff; border: 2px solid #d9cef8; }
    .panel h2 { margin: 0; font-size: 24px; line-height: 1.14; font-weight: 800; }
    .panel p { margin: 0; font-size: 16px; line-height: 1.34; font-weight: 600; color: #42557c; }
    .example {
      background: #fff;
      border-radius: 18px;
      padding: 14px 16px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .example strong { font-size: 18px; line-height: 1.12; font-weight: 800; }
    .example span { font-size: 15px; line-height: 1.32; font-weight: 600; color: #5b6f95; }
    .chips { display: flex; flex-wrap: wrap; gap: 10px; }
    .chip {
      background: #fff;
      border-radius: 14px;
      padding: 10px 14px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      font-size: 15px;
      line-height: 1.2;
      font-weight: 800;
    }
    .thread-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .thread {
      background: #fff;
      border-radius: 18px;
      border: 2px solid #e1dbfa;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .thread strong { font-size: 17px; line-height: 1.2; font-weight: 800; }
    .thread span { font-size: 15px; line-height: 1.32; font-weight: 600; color: #5b6f95; }
    .review {
      background: #eef8ff;
      border: 2px solid #b7dce8;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .review h2 { margin: 0; font-size: 24px; line-height: 1.14; font-weight: 800; }
    .review-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .review-item {
      background: #fff;
      border: 2px solid #d6e4f2;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 15px;
      line-height: 1.32;
      font-weight: 700;
      color: #42557c;
    }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="860">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Puede sonar coherente y aun así equivocarse</h1>
            <p>Dos fuentes comunes de error son la alucinación y el arrastre del contexto reciente. Ninguna se detecta solo por el tono de seguridad.</p>
          </div>

          <div class="top-grid">
            <section class="panel hall">
              <h2>Alucinación</h2>
              <p>Si faltan datos, la fecha de corte quedó atrás o la pregunta obliga a improvisar, el modelo puede completar el vacío con una salida plausible pero falsa.</p>
              <div class="example">
                <strong>Ejemplo típico</strong>
                <span>Una pregunta sobre resultados recientes, como París 2024, puede devolver nombres y medallas que suenan verosímiles pero no coinciden con la fuente real.</span>
              </div>
              <div class="chips">
                <span class="chip">fecha de corte</span>
                <span class="chip">aleatoriedad</span>
                <span class="chip">tono seguro</span>
              </div>
            </section>

            <section class="panel memory">
              <h2>Memoria conversacional</h2>
              <p>La nueva pregunta llega junto con partes del historial reciente. Si el nombre o la tarea son ambiguos, la respuesta puede heredar el tema anterior.</p>
              <div class="thread-grid">
                <div class="thread">
                  <strong>Después de Steve Jobs</strong>
                  <span>Un nombre desconocido tiende a describirse con vocabulario de empresa o tecnología.</span>
                </div>
                <div class="thread">
                  <strong>Después de Taylor Swift</strong>
                  <span>El mismo nombre desconocido puede describirse con vocabulario de música o espectáculo.</span>
                </div>
              </div>
            </section>
          </div>

          <section class="review">
            <h2>Qué conviene revisar</h2>
            <div class="review-grid">
              <div class="review-item">Compara con una fuente externa cuando el dato sea reciente o verificable.</div>
              <div class="review-item">Abre un chat nuevo si el historial puede contaminar la respuesta.</div>
              <div class="review-item">Haz la misma pregunta con otra redacción para ver si el patrón cambia.</div>
              <div class="review-item">No confundas seguridad verbal con evidencia real.</div>
            </div>
          </section>

          <section class="takeaway">
            <p>Confiar en un chatbot exige revisar datos, contexto y fuente, no solo si la respuesta parece bien escrita.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
