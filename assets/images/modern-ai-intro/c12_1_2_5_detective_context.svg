<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Traducción automática: revisar como detective</title>
  <desc id="desc">Infografía sobre un método de prueba para detectar patrones en traducción automática cambiando una sola variable por vez.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root { width: 100%; height: 100%; font-family: "Segoe UI", Arial, sans-serif; color: #273a69; }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .heading { display: flex; flex-direction: column; gap: 12px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.12; font-weight: 800; }
    .heading p { margin: 0; max-width: 860px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .step {
      border-radius: 22px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 118px;
    }
    .step h2 { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 800; }
    .step p { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .s1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .s1 h2 { color: #178ca7; }
    .s2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .s2 h2 { color: #7e63d9; }
    .s3 { background: #fff5ea; border: 2px solid #efc89b; }
    .s3 h2 { color: #d88021; }
    .s4 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .s4 h2 { color: #2f8f5b; }
    .cases { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .case {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .case h3 { margin: 0; font-size: 20px; line-height: 1.18; font-weight: 800; }
    .case p { margin: 0; font-size: 17px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .case-a { background: #eef8ff; border: 2px solid #b7dce8; }
    .case-b { background: #fff5ea; border: 2px solid #efc89b; }
    .search {
      background: #f4f6ff;
      border: 2px solid #d7ddfb;
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .search h3 { margin: 0; font-size: 22px; line-height: 1.12; font-weight: 800; }
    .search p { margin: 0; font-size: 17px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      text-align: center;
      color: #fff;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="820">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Probar una variable a la vez revela el patrón</h1>
            <p>La mejor revisión no acepta la primera salida sin más: la pone a prueba con cambios pequeños y casos que ya conoces.</p>
          </div>

          <div class="steps">
            <article class="step s1">
              <h2>1. Aislar</h2>
              <p>recorta la frase hasta quedarte con la parte dudosa</p>
            </article>
            <article class="step s2">
              <h2>2. Cambiar</h2>
              <p>modifica una sola palabra, signo o pista de contexto</p>
            </article>
            <article class="step s3">
              <h2>3. Observar</h2>
              <p>anota cuándo la traducción pasa de literal a idiomática</p>
            </article>
            <article class="step s4">
              <h2>4. Confirmar</h2>
              <p>usa ejemplos donde ya sabes cuál salida debería aparecer</p>
            </article>
          </div>

          <div class="cases">
            <section class="case case-a">
              <h3>Caso A: I realized it was a piece of cake</h3>
              <p>suena a evaluación mental y favorece la lectura idiomática</p>
            </section>
            <section class="case case-b">
              <h3>Caso B: I saw that it was a piece of cake</h3>
              <p>suena más visual y puede empujar a una lectura literal</p>
            </section>
          </div>

          <section class="search">
            <h3>Qué conviene buscar</h3>
            <p>patrones consistentes, excepciones, cambios inesperados y ejemplos que contradicen la intuición inicial</p>
          </section>

          <section class="takeaway">
            <p>Revisar una traducción es investigar, no solo aceptar la primera salida plausible.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
