<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">RAG, ajuste fino y agentes</title>
  <desc id="desc">Infografía que distingue recuperación de contexto, entrenamiento adicional y capas de autonomía sobre un LLM.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 28px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 28px 30px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; }
    .heading p { margin: 0; max-width: 980px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 132px;
    }
    .card h2 { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #fff5ea; border: 2px solid #efc89b; }
    .c3 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .compare {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .pill {
      background: #eef9f1;
      border: 2px solid #b8dfc3;
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 104px;
    }
    .pill strong { font-size: 18px; line-height: 1.12; font-weight: 800; color: #2b8a57; }
    .pill span { font-size: 15px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .takeaway {
      background: #283a66;
      border-radius: 22px;
      padding: 18px 22px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="700">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Tres formas distintas de volver útil a un LLM</h1>
            <p>RAG, ajuste fino y agentes suelen mezclarse en conversaciones sobre IA, pero resuelven problemas distintos.</p>
          </div>

          <div class="grid">
            <article class="card c1">
              <h2>RAG</h2>
              <p>Antes de responder, recupera fragmentos relevantes desde una base vectorial para anclar la salida en información concreta.</p>
            </article>
            <article class="card c2">
              <h2>Ajuste fino</h2>
              <p>Modifica el modelo con datos curados de un dominio o estilo para que aprenda nuevo comportamiento o conocimiento.</p>
            </article>
            <article class="card c3">
              <h2>Agentes</h2>
              <p>Añaden reflexión, planificación, uso de herramientas y colaboración para ejecutar procesos con más autonomía.</p>
            </article>
          </div>

          <div class="compare">
            <div class="pill">
              <strong>RAG trae</strong>
              <span>Contexto puntual en el momento de la consulta.</span>
            </div>
            <div class="pill">
              <strong>Ajuste fino cambia</strong>
              <span>El modelo mediante entrenamiento adicional.</span>
            </div>
            <div class="pill">
              <strong>Agente decide</strong>
              <span>Qué pasos dar y qué herramientas usar.</span>
            </div>
          </div>

          <section class="takeaway">
            <p>Si el problema es “no sabe esta información”, piensa en RAG o ajuste fino. Si el problema es “debe decidir y ejecutar pasos”, piensa en agentes.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
