<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: dificultad de la tarea y elección de modelo</title>
  <desc id="desc">Infografía sobre tareas más fáciles y más difíciles, uso de varios chatbots y diferencia entre modelos alojados y locales.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="790" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 30px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 960px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .card {
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 220px;
    }
    .easy { background: #eef8ff; border: 2px solid #b7dce8; }
    .hard { background: #fff5ea; border: 2px solid #efc89b; }
    .model { background: #f3f0ff; border: 2px solid #d9cef8; }
    .card h2 { margin: 0; font-size: 23px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 14px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: #fff;
      border-radius: 16px;
      padding: 10px 12px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      font-size: 14px;
      line-height: 1.28;
      font-weight: 700;
      color: #42557c;
    }
    .model-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .mini {
      background: #fff;
      border-radius: 16px;
      border: 2px solid #e1dbfa;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .mini strong { font-size: 16px; line-height: 1.12; font-weight: 800; }
    .mini span { font-size: 13px; line-height: 1.28; font-weight: 600; color: #5b6f95; }
    .compare {
      background: #eef9f1;
      border: 2px solid #b8dfc3;
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .compare h2 { margin: 0; font-size: 22px; line-height: 1.14; font-weight: 800; }
    .compare-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .compare-item {
      background: #fff;
      border: 2px solid #cce6d4;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .compare-item strong { font-size: 17px; line-height: 1.12; font-weight: 800; color: #2f8f5b; }
    .compare-item span { font-size: 14px; line-height: 1.28; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 18px 22px;
      text-align: center;
      color: #fff;
    }
    .takeaway p { margin: 0; font-size: 19px; line-height: 1.24; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="790">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>No todas las tareas ni todos los modelos pesan igual</h1>
            <p>La dificultad sube cuando hay una sola respuesta correcta, varios pasos, menos datos de entrenamiento o una validación estricta.</p>
          </div>

          <div class="top-grid">
            <section class="card easy">
              <h2>Tareas más accesibles</h2>
              <p>Admiten varias salidas razonables o se apoyan en patrones frecuentes del lenguaje.</p>
              <div class="stack">
                <div class="item">Sugerir formas de decir “te quiero”.</div>
                <div class="item">Proponer una receta o ideas para vacaciones.</div>
                <div class="item">Traducir entre idiomas con mucho material, como inglés y español.</div>
              </div>
            </section>

            <section class="card hard">
              <h2>Tareas más exigentes</h2>
              <p>Exigen razonamiento, precisión o datos menos abundantes.</p>
              <div class="stack">
                <div class="item">Resolver lógica o matemáticas con una única respuesta válida.</div>
                <div class="item">Escribir algo largo y coherente en varios pasos, como un guion.</div>
                <div class="item">Traducir entre idiomas con menos ejemplos de entrenamiento.</div>
              </div>
            </section>

            <section class="card model">
              <h2>Qué modelo conviene</h2>
              <p>No siempre gana el mismo: importa la tarea, el costo y el nivel de privacidad que necesitas.</p>
              <div class="model-grid">
                <div class="mini">
                  <strong>Alojado</strong>
                  <span>Suele rendir mejor en tareas duras, pero envía tu prompt por internet.</span>
                </div>
                <div class="mini">
                  <strong>Local</strong>
                  <span>Sirve para tareas simples, funciona offline y deja más control sobre tus datos.</span>
                </div>
              </div>
            </section>
          </div>

          <section class="compare">
            <h2>Usar más de un chatbot ayuda</h2>
            <div class="compare-grid">
              <div class="compare-item">
                <strong>Segunda opinión</strong>
                <span>Dos modelos distintos dejan ver si una respuesta se repite o si era solo una suposición plausible.</span>
              </div>
              <div class="compare-item">
                <strong>Cuotas y cambios</strong>
                <span>Los rankings, límites gratis y versiones disponibles cambian rápido; conviene no depender de uno solo.</span>
              </div>
              <div class="compare-item">
                <strong>Rasgos distintos</strong>
                <span>Unos son más breves, otros más explicativos; algunos priorizan herramientas, otros privacidad u operación local.</span>
              </div>
            </div>
          </section>

          <section class="takeaway">
            <p>Empieza por el modelo más ligero que resuelva la tarea y sube de nivel cuando la precisión realmente lo justifique.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
