<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: expandir preguntas</title>
  <desc id="desc">Infografía sobre cómo ampliar una pregunta con estructura, seguimiento, reflexión y aclaraciones más específicas.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 930px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 130px;
    }
    .card h2 { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .c3 { background: #fff5ea; border: 2px solid #efc89b; }
    .c4 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .c5 { background: #f6f8fb; border: 2px solid #d9dfeb; }
    .c6 { background: #fef4f2; border: 2px solid #f2c8bf; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="840">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Preguntar mejor cambia la profundidad de la respuesta</h1>
            <p>Una pregunta breve puede servir para arrancar, pero el valor real aparece cuando vas afinando estructura, seguimiento y foco.</p>
          </div>

          <div class="grid">
            <article class="card c1">
              <h2>Pregunta directa</h2>
              <p>Sirve para arrancar: “¿Qué es…?”, “¿Cuál es la diferencia entre…?” o “Explícame…”.</p>
            </article>
            <article class="card c2">
              <h2>Estructura explícita</h2>
              <p>Pedir comparar, listar, describir o dividir en pasos suele producir respuestas más completas.</p>
            </article>
            <article class="card c3">
              <h2>Seguimiento</h2>
              <p>Después de la primera respuesta, conviene pedir que profundice solo en la parte que más te interesó.</p>
            </article>
          </div>

          <div class="grid">
            <article class="card c4">
              <h2>Reflexión</h2>
              <p>Pedir que revise su propia salida ayuda a detectar omisiones, errores factuales o matices que faltaban.</p>
            </article>
            <article class="card c5">
              <h2>Llenar huecos</h2>
              <p>Si recuerdas una idea pero no el término exacto, describirla y pedir varias opciones ayuda a recuperar vocabulario.</p>
            </article>
            <article class="card c6">
              <h2>Aclarar una confusión</h2>
              <p>También sirve para deshacer dudas sutiles, como distinguir dos palabras parecidas o dos usos cercanos.</p>
            </article>
          </div>

          <section class="takeaway">
            <p>Empieza amplio, detecta la parte útil y luego estrecha la conversación hasta que el chatbot trabaje justo sobre tu duda real.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
