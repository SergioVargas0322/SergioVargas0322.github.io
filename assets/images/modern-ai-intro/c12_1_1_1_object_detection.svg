<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">Cómo la visión artificial detecta objetos</title>
  <desc id="desc">Comparación entre localización, clasificación y detección de objetos mediante cuadros delimitadores y etiquetas.</desc>
  <foreignObject x="0" y="0" width="1200" height="940">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; }
        .page {
          width: 1200px;
          height: 940px;
          padding: 36px;
          background: linear-gradient(135deg, #edf2ff 0%, #f7fbff 52%, #eef8f4 100%);
          font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .frame {
          height: 100%;
          padding: 32px 36px;
          border-radius: 30px;
          border: 3px solid #d8e0f0;
          background: rgba(255, 255, 255, 0.96);
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        h1, h2, h3, p { margin: 0; }
        h1 {
          color: #1c2c52;
          font-size: 42px;
          line-height: 1.05;
        }
        .lead {
          color: #55657f;
          font-size: 19px;
          line-height: 1.36;
          font-weight: 600;
          max-width: 1020px;
        }
        .grid {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 18px;
        }
        .card {
          padding: 20px;
          border-radius: 24px;
          border: 2px solid;
          display: flex;
          flex-direction: column;
          gap: 14px;
          min-height: 372px;
        }
        .loc { background: #eef2ff; border-color: #cbd4f1; }
        .cls { background: #eef9fa; border-color: #c3dde0; }
        .det { background: #fff5ea; border-color: #e7cfb0; }
        .thumb {
          height: 144px;
          border-radius: 18px;
          background: #fff;
          position: relative;
          overflow: hidden;
          border: 2px solid rgba(30, 50, 80, 0.08);
        }
        .scene {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 18% 18%, #fff5cc 0 10%, transparent 11%),
            linear-gradient(180deg, #cae7ff 0%, #edf8ff 48%, #d5edd7 48%, #d5edd7 100%);
        }
        .blob {
          position: absolute;
          border-radius: 999px;
        }
        .person {
          left: 24px;
          bottom: 24px;
          width: 58px;
          height: 100px;
          background: #5162a8;
        }
        .flower {
          left: 106px;
          bottom: 44px;
          width: 36px;
          height: 36px;
          background: #e59c2d;
        }
        .tree {
          right: 20px;
          bottom: 20px;
          width: 68px;
          height: 110px;
          background: #5a9f74;
        }
        .box {
          position: absolute;
          border: 4px solid;
          border-radius: 14px;
        }
        .b1 { left: 16px; top: 38px; width: 84px; height: 106px; border-color: #596fc5; }
        .b2 { left: 94px; top: 70px; width: 56px; height: 56px; border-color: #d88b20; }
        .b3 { right: 12px; top: 26px; width: 82px; height: 128px; border-color: #2f8a67; }
        .label {
          position: absolute;
          padding: 6px 10px;
          border-radius: 999px;
          color: #fff;
          font-size: 13px;
          font-weight: 800;
          letter-spacing: 0.02em;
        }
        .l1 { left: 18px; top: 10px; background: #596fc5; }
        .l2 { left: 96px; top: 40px; background: #d88b20; }
        .l3 { right: 14px; top: 6px; background: #2f8a67; }
        .card h2 {
          color: #203253;
          font-size: 27px;
        }
        .card p {
          color: #51637c;
          font-size: 17px;
          line-height: 1.38;
          font-weight: 600;
        }
        .footer {
          margin-top: auto;
          padding: 18px 22px;
          border-radius: 24px;
          background: #203052;
          color: #fff;
        }
        .footer h3 {
          font-size: 24px;
          margin-bottom: 8px;
        }
        .footer p {
          color: #edf2ff;
          font-size: 17px;
          line-height: 1.36;
          font-weight: 600;
        }
      </style>
      <div class="frame">
        <h1>Localizar no es lo mismo que clasificar</h1>
        <p class="lead">La visión artificial separa varias tareas que a simple vista parecen una sola. Primero puede indicar dónde está algo; después puede decir qué es; y cuando combina ambas cosas, puede detectar varios objetos dentro de una misma imagen.</p>
        <div class="grid">
          <div class="card loc">
            <div class="thumb">
              <div class="scene"></div>
              <div class="blob person"></div>
              <div class="blob flower"></div>
              <div class="blob tree"></div>
              <div class="box b1"></div>
              <div class="box b2"></div>
              <div class="box b3"></div>
            </div>
            <h2>Localización</h2>
            <p>Marca regiones de interés con cuadros delimitadores. Dice dónde hay algo relevante, pero todavía no asigna una categoría a ese contenido.</p>
          </div>
          <div class="card cls">
            <div class="thumb">
              <div class="scene"></div>
              <div class="blob person"></div>
              <div class="label l1">persona</div>
            </div>
            <h2>Clasificación</h2>
            <p>Asigna una clase a una imagen o a un recorte, como perro, flor o persona. El foco está en nombrar, no en señalar con precisión todos los objetos.</p>
          </div>
          <div class="card det">
            <div class="thumb">
              <div class="scene"></div>
              <div class="blob person"></div>
              <div class="blob flower"></div>
              <div class="blob tree"></div>
              <div class="box b1"></div>
              <div class="box b2"></div>
              <div class="box b3"></div>
              <div class="label l1">persona</div>
              <div class="label l2">flor</div>
              <div class="label l3">árbol</div>
            </div>
            <h2>Detección</h2>
            <p>Combina localización y clasificación. La salida indica a la vez dónde está cada objeto y cuál es su etiqueta dentro de la escena.</p>
          </div>
        </div>
        <div class="footer">
          <h3>Qué cambia el resultado</h3>
          <p>El ángulo de la foto, el encuadre y el tamaño del cuadro delimitador alteran la precisión. Un objeto mejor centrado o un recorte más ajustado suele producir etiquetas más útiles y específicas.</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
