<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: etiquetar y agrupar muchos textos</title>
  <desc id="desc">Infografía sobre convertir múltiples respuestas en etiquetas, tablas y resúmenes agrupados, verificando antes el material de entrada.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 940px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 156px;
    }
    .card h2 { margin: 0; font-size: 20px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .c3 { background: #fff5ea; border: 2px solid #efc89b; }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .note {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .n1 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .n2 { background: #f6f8fb; border: 2px solid #d9dfeb; }
    .note h2 { margin: 0; font-size: 20px; line-height: 1.12; font-weight: 800; }
    .note p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="860">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Etiquetar primero ayuda a resumir después</h1>
            <p>Cuando tienes muchas respuestas sueltas, el paso intermedio útil no es resumir de inmediato: es convertir el caos en etiquetas y grupos comparables.</p>
          </div>

          <div class="top-grid">
            <article class="card c1">
              <h2>Verifica la entrada</h2>
              <p>Antes de contar o clasificar, confirma que el enlace o documento sí incluye todo el material y no oculta parte de las respuestas.</p>
            </article>
            <article class="card c2">
              <h2>Etiqueta cada pieza</h2>
              <p>Clasificar por tema, sentimiento o postura permite pasar de cientos de textos a una tabla operable.</p>
            </article>
            <article class="card c3">
              <h2>Agrupa y resume</h2>
              <p>Una vez etiquetado, ya puedes contar cuántos casos hay por grupo y resumir sus argumentos principales.</p>
            </article>
          </div>

          <div class="bottom-grid">
            <section class="note n1">
              <h2>Define las reglas del conteo</h2>
              <p>Si quieres una medición justa, aclara cosas como “un conteo por respuesta” para no inflar categorías por repeticiones dentro del mismo texto.</p>
            </section>
            <section class="note n2">
              <h2>Protege el objetivo del prompt</h2>
              <p>Con documentos largos, ayuda poner la tarea al principio y usar delimitadores para que el objetivo no se pierda en medio del contexto.</p>
            </section>
          </div>

          <section class="takeaway">
            <p>Etiquetar convierte texto masivo en estructura; esa estructura es la que luego vuelve posible un buen resumen.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
