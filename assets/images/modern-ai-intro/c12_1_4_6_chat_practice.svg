<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: conversar y practicar</title>
  <desc id="desc">Infografía sobre usar chatbots para conversar, practicar entrevistas y coordinar roles de apoyo o revisión.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 930px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 190px;
    }
    .card h2 { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .c3 { background: #fff5ea; border: 2px solid #efc89b; }
    .note {
      background: #eef9f1;
      border: 2px solid #b8dfc3;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note h2 { margin: 0; font-size: 22px; line-height: 1.14; font-weight: 800; }
    .note p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="820">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Conversar también puede ser una forma de practicar</h1>
            <p>La utilidad no está solo en pedir información; también está en ensayar, recibir preguntas de vuelta y probar distintos roles.</p>
          </div>

          <div class="grid">
            <article class="card c1">
              <h2>Conversación abierta</h2>
              <p>Sirve para explorar un tema en varios turnos, pedir aclaraciones y dejar que el chatbot haga preguntas de seguimiento.</p>
            </article>
            <article class="card c2">
              <h2>Entrevista simulada</h2>
              <p>Permite practicar respuestas, tono y seguridad antes de una conversación real con un entrevistador o cliente.</p>
            </article>
            <article class="card c3">
              <h2>Colaboración entre roles</h2>
              <p>Un rol puede producir borradores y otro revisarlos, o uno puede entrevistar mientras otro evalúa la respuesta.</p>
            </article>
          </div>

          <section class="note">
            <h2>Qué conviene observar</h2>
            <p>En modo conversación importa el hilo completo: continuidad, pertinencia de las repreguntas, calidad del feedback y si el rol asignado realmente cambia el comportamiento del modelo.</p>
          </section>

          <section class="takeaway">
            <p>Conversar con un chatbot sirve menos para “tener razón” y más para ensayar, aclarar y mejorar la siguiente versión de tu respuesta.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
