<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: predicción de la siguiente palabra</title>
  <desc id="desc">Infografía sobre generación paso a paso, contexto acumulado y por qué suele ayudar razonar antes de responder.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="770" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 30px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 26px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 940px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .main-grid { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 18px; }
    .panel {
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .build { background: #eef8ff; border: 2px solid #b7dce8; }
    .orders { background: #f3f0ff; border: 2px solid #d9cef8; }
    .panel h2 { margin: 0; font-size: 24px; line-height: 1.14; font-weight: 800; }
    .panel p { margin: 0; font-size: 16px; line-height: 1.34; font-weight: 600; color: #42557c; }
    .prompt-box {
      background: #fff;
      border: 2px solid #d6e4f2;
      border-radius: 16px;
      padding: 14px 16px;
      font-size: 20px;
      line-height: 1.16;
      font-weight: 800;
    }
    .tokens { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .token {
      background: #fff;
      border: 2px solid #d6e4f2;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .token strong { font-size: 18px; line-height: 1.1; font-weight: 800; }
    .token span { font-size: 14px; line-height: 1.3; font-weight: 600; color: #5b6f95; }
    .llm-note {
      background: #f4f6ff;
      border: 2px solid #d7ddfb;
      border-radius: 16px;
      padding: 12px 14px;
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
    }
    .order-stack { display: flex; flex-direction: column; gap: 12px; }
    .order-card {
      background: #fff;
      border: 2px solid #e1dbfa;
      border-radius: 18px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .order-card h3 { margin: 0; font-size: 19px; line-height: 1.12; font-weight: 800; }
    .order-card p { margin: 0; font-size: 14px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .tips {
      background: #fff5ea;
      border: 2px solid #efc89b;
      border-radius: 24px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .tips h2 { margin: 0; font-size: 22px; line-height: 1.14; font-weight: 800; }
    .tip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .tip {
      background: #fff;
      border: 2px solid #f1d3b0;
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tip strong { font-size: 17px; line-height: 1.1; font-weight: 800; color: #d88021; }
    .tip span { font-size: 14px; line-height: 1.3; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 18px 22px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 19px; line-height: 1.24; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="770">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>La respuesta se construye palabra por palabra</h1>
            <p>Un modelo de lenguaje no decide todo al final. Va extendiendo el texto y usa lo ya escrito como contexto para elegir lo siguiente.</p>
          </div>

          <div class="main-grid">
            <section class="panel build">
              <h2>Contexto acumulado</h2>
              <div class="prompt-box">Twinkle, twinkle, little</div>
              <div class="tokens">
                <div class="token">
                  <strong>star</strong>
                  <span>se añade al prompt y cambia el contexto</span>
                </div>
                <div class="token">
                  <strong>how</strong>
                  <span>la siguiente predicción ya usa la frase más larga</span>
                </div>
                <div class="token">
                  <strong>I</strong>
                  <span>cada palabra nueva afecta la probabilidad de la siguiente</span>
                </div>
              </div>
              <div class="llm-note">LLM significa modelo de lenguaje grande: aprende a continuar texto a gran escala y por eso puede traducir, resumir o responder si el prompt lo orienta.</div>
            </section>

            <section class="panel orders">
              <h2>El orden importa</h2>
              <div class="order-stack">
                <article class="order-card">
                  <h3>Respuesta primero</h3>
                  <p>Si la respuesta sale antes del razonamiento, ese razonamiento ya no puede mejorar lo que se dijo al principio.</p>
                </article>
                <article class="order-card">
                  <h3>Razonamiento primero</h3>
                  <p>Si el modelo desarrolla pasos, esquema o análisis antes de contestar, la salida final aprovecha ese contexto extra.</p>
                </article>
              </div>
            </section>
          </div>

          <section class="tips">
            <h2>Cómo aprovechar ese comportamiento</h2>
            <div class="tip-grid">
              <div class="tip">
                <strong>Pide primero el andamiaje</strong>
                <span>Esquema, investigación, razonamiento o lista de pasos antes de la respuesta final.</span>
              </div>
              <div class="tip">
                <strong>Ordena las subtareas</strong>
                <span>Primero reunir información, después compararla y al final concluir.</span>
              </div>
              <div class="tip">
                <strong>Incluye la tarea en el prompt</strong>
                <span>Traducir, resumir o evaluar se activa mejor si la instrucción va dentro de la entrada.</span>
              </div>
            </div>
          </section>

          <section class="takeaway">
            <p>Un buen prompt no solo pide una respuesta: prepara el contexto que esa respuesta va a necesitar.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
