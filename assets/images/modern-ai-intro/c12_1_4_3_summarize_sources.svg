<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: sintetizar una fuente</title>
  <desc id="desc">Infografía sobre cómo resumir un artículo largo, pedir citas directas y verificar si la salida realmente proviene del material original.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 930px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .stage {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 160px;
    }
    .stage h2 { margin: 0; font-size: 21px; line-height: 1.12; font-weight: 800; }
    .stage p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .s1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .s2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .s3 { background: #fff5ea; border: 2px solid #efc89b; }
    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .check {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .c1 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .c2 { background: #f6f8fb; border: 2px solid #d9dfeb; }
    .check h2 { margin: 0; font-size: 20px; line-height: 1.12; font-weight: 800; }
    .check p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="840">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Resumir sirve si el modelo realmente ve la fuente</h1>
            <p>No basta con decir “resume”. Hay que indicar el subtema, comprobar que la fuente llegó completa y verificar que la salida esté anclada al original.</p>
          </div>

          <div class="flow">
            <section class="stage s1">
              <h2>1. Preparar la fuente</h2>
              <p>Puedes usar enlace, documento o texto pegado, pero primero conviene comprobar que el contenido visible sea el esperado.</p>
            </section>
            <section class="stage s2">
              <h2>2. Pedir foco temático</h2>
              <p>La síntesis mejora cuando señalas qué parte del artículo o documento te interesa realmente.</p>
            </section>
            <section class="stage s3">
              <h2>3. Verificar contra el original</h2>
              <p>Si hay citas, revisa una o dos frases. Si el chatbot no enlaza la fuente, verifica manualmente.</p>
            </section>
          </div>

          <div class="checks">
            <section class="check c1">
              <h2>Cuando importa el wording exacto</h2>
              <p>Si necesitas el texto tal cual aparece en la fuente, pide “extraer citas directas” o “texto relevante palabra por palabra”, no solo “resumir”.</p>
            </section>
            <section class="check c2">
              <h2>Contexto y limpieza</h2>
              <p>HTML, referencias y formato extra consumen contexto. A veces el texto limpio pegado en el prompt funciona mejor que un archivo pesado.</p>
            </section>
          </div>

          <section class="takeaway">
            <p>En síntesis documental, la calidad no depende solo del resumen: depende de si puedes demostrar que salió de la fuente correcta.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
