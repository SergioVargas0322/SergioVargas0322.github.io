<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">Pausa estratégica e incubación</title>
  <desc id="desc">Diagrama del ciclo de preparación, pausa, iluminación y verificación para consolidar el aprendizaje y destrabar problemas.</desc>
  <foreignObject x="0" y="0" width="1200" height="880">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; }
        .page {
          width: 1200px;
          height: 880px;
          padding: 36px;
          background: linear-gradient(135deg, #eef2ff 0%, #f7fbff 55%, #f2f9f4 100%);
          font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .frame {
          height: 100%;
          padding: 32px 36px;
          border-radius: 30px;
          border: 3px solid #d9e0ef;
          background: rgba(255,255,255,0.96);
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        h1, h2, p { margin: 0; }
        h1 {
          color: #1d2c52;
          font-size: 42px;
          line-height: 1.05;
        }
        .lead {
          color: #55657f;
          font-size: 19px;
          line-height: 1.36;
          font-weight: 600;
          max-width: 1030px;
        }
        .steps {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 14px;
        }
        .step {
          padding: 18px 18px;
          border-radius: 24px;
          border: 2px solid;
          min-height: 264px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        }
        .s1 { background: #eef2ff; border-color: #cad3f2; }
        .s2 { background: #eef9fa; border-color: #c4dde0; }
        .s3 { background: #fff5ea; border-color: #e6cfb1; }
        .s4 { background: #f5f1ff; border-color: #d8cdf3; }
        .num {
          width: 42px;
          height: 42px;
          border-radius: 999px;
          display: grid;
          place-items: center;
          color: #fff;
          font-size: 20px;
          font-weight: 900;
        }
        .s1 .num { background: #5c6bc0; }
        .s2 .num { background: #2c7c8f; }
        .s3 .num { background: #d07a28; }
        .s4 .num { background: #7a57c2; }
        .step h2 {
          color: #203253;
          font-size: 25px;
        }
        .step p {
          color: #52637d;
          font-size: 17px;
          line-height: 1.34;
          font-weight: 600;
        }
        .notes {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 14px;
        }
        .note {
          padding: 16px 18px;
          border-radius: 22px;
          background: #fff;
          border: 2px solid rgba(31, 48, 78, 0.1);
        }
        .note h2 {
          color: #203253;
          font-size: 22px;
          margin-bottom: 8px;
        }
        .note p {
          color: #51637c;
          font-size: 16px;
          line-height: 1.34;
          font-weight: 600;
        }
      </style>
      <div class="frame">
        <h1>La pausa también forma parte del trabajo</h1>
        <p class="lead">Cuando una tarea visual o conceptual se atasca, insistir sin descanso no siempre mejora el resultado. Alternar trabajo enfocado con una pausa breve ayuda a volver con otra perspectiva.</p>
        <div class="steps">
          <div class="step s1">
            <div class="num">1</div>
            <h2>Preparación</h2>
            <p>Se intenta resolver el problema, se reúnen datos y se exploran posibles caminos. Esta fase aclara qué se entiende y qué sigue bloqueado.</p>
          </div>
          <div class="step s2">
            <div class="num">2</div>
            <h2>Incubación</h2>
            <p>La mente deja de forzar el problema de manera directa. Caminar, cambiar de tarea o dormir un poco puede liberar nuevas asociaciones.</p>
          </div>
          <div class="step s3">
            <div class="num">3</div>
            <h2>Iluminación</h2>
            <p>Aparece una idea nueva, una conexión inesperada o una forma más simple de entender la tarea después de haber tomado distancia.</p>
          </div>
          <div class="step s4">
            <div class="num">4</div>
            <h2>Verificación</h2>
            <p>La nueva idea se pone a prueba. Si funciona, se integra; si no funciona, el ciclo vuelve a empezar con mejor comprensión.</p>
          </div>
        </div>
        <div class="notes">
          <div class="note">
            <h2>Pensamiento no consciente</h2>
            <p>Parte del procesamiento sigue activo aunque ya no se esté mirando el problema de frente.</p>
          </div>
          <div class="note">
            <h2>Asociaciones remotas</h2>
            <p>La pausa permite conectar ideas que parecían separadas y encontrar una salida menos obvia.</p>
          </div>
          <div class="note">
            <h2>Recuperación</h2>
            <p>Descansar reduce fatiga y mejora la calidad con la que se evalúan nuevas soluciones al volver.</p>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
