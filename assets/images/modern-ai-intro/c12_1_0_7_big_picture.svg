<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Panorama general para estudiar el módulo</title>
  <desc id="desc">Mapa visual que conecta inteligencia artificial, aprendizaje automático, modelos y aplicaciones prácticas con una vista global.</desc>
  <foreignObject x="0" y="0" width="1200" height="1040">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; }
        .page {
          width: 1200px;
          height: 1040px;
          padding: 36px;
          background: linear-gradient(135deg, #eef2ff 0%, #f7fbff 52%, #f6f0ff 100%);
          font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .frame {
          height: 100%;
          padding: 34px 38px;
          border-radius: 28px;
          border: 3px solid #d7dff2;
          background: rgba(255, 255, 255, 0.96);
          display: grid;
          grid-template-columns: 1.3fr 0.9fr;
          gap: 22px;
        }
        .left, .right {
          display: flex;
          flex-direction: column;
          gap: 20px;
        }
        h1, h2, p { margin: 0; }
        h1 {
          color: #1d2b4f;
          font-size: 42px;
          line-height: 1.05;
        }
        .lead {
          color: #52627d;
          font-size: 20px;
          font-weight: 600;
          line-height: 1.35;
        }
        .stack {
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .layer {
          padding: 22px 24px;
          border-radius: 22px;
          border: 2px solid;
        }
        .layer h2 {
          color: #203052;
          font-size: 27px;
          margin-bottom: 10px;
        }
        .layer p {
          color: #51637c;
          font-size: 18px;
          line-height: 1.36;
          font-weight: 600;
        }
        .ai { background: #eef2ff; border-color: #cad3f2; }
        .ml { background: #eef8f9; border-color: #c1dcde; }
        .models { background: #fff6ec; border-color: #e6cfb1; }
        .apps { background: #f5f1ff; border-color: #d9cdf3; }
        .tip, .result {
          padding: 22px;
          border-radius: 22px;
          border: 2px solid;
        }
        .tip {
          background: #f7fbff;
          border-color: #d6e2ef;
        }
        .result {
          margin-top: auto;
          background: #203052;
          border-color: #203052;
        }
        .tip h2 {
          color: #203052;
          font-size: 26px;
          margin-bottom: 12px;
        }
        .tip p {
          color: #52627d;
          font-size: 18px;
          line-height: 1.38;
          font-weight: 600;
        }
        .result h2 {
          color: #fff;
          font-size: 26px;
          margin-bottom: 12px;
        }
        .result p {
          color: #edf2ff;
          font-size: 18px;
          line-height: 1.4;
          font-weight: 600;
        }
      </style>
      <div class="frame">
        <div class="left">
          <h1>Primero el mapa, luego el detalle</h1>
          <p class="lead">Conviene entender primero cómo se relacionan los conceptos grandes y usar ese mapa para que los términos nuevos no aparezcan como piezas sueltas.</p>
          <div class="stack">
            <div class="layer ai">
              <h2>Inteligencia artificial</h2>
              <p>Es el campo amplio: busca que las máquinas realicen tareas que asociamos con inteligencia.</p>
            </div>
            <div class="layer ml">
              <h2>Aprendizaje automático</h2>
              <p>Es una subárea de la IA: mejora tareas a partir de datos, experiencia y retroalimentación.</p>
            </div>
            <div class="layer models">
              <h2>Modelos</h2>
              <p>Son las herramientas concretas que reciben entradas, producen salidas y almacenan conocimiento en parámetros.</p>
            </div>
            <div class="layer apps">
              <h2>Aplicaciones</h2>
              <p>Visión artificial, traducción, chatbots y generación aparecen como manifestaciones prácticas de esos modelos.</p>
            </div>
          </div>
        </div>
        <div class="right">
          <div class="tip">
            <h2>Cómo orientarse</h2>
            <p>No memorices primero palabras como feature, parámetro, red neuronal o inferencia. Empieza identificando qué problema resuelve cada una y dónde encaja dentro del mapa general.</p>
          </div>
          <div class="tip">
            <h2>Analogía útil</h2>
            <p>La tostadora sirve para fijar la idea central: entradas, parámetros, salida, comparación con la respuesta correcta y mejora progresiva.</p>
          </div>
          <div class="result">
            <h2>Idea de cierre</h2>
            <p>Con esta visión global resulta más fácil entender por qué la visión artificial es una aplicación específica de modelos entrenados y no un concepto aislado.</p>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
