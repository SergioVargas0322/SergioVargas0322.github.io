<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: transformar y evaluar</title>
  <desc id="desc">Infografía sobre traducir y reformular contenido, además de verificar hechos y calificar respuestas con criterios explícitos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 940px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 310px;
    }
    .transform { background: #eef8ff; border: 2px solid #b7dce8; }
    .evaluate { background: #fff5ea; border: 2px solid #efc89b; }
    .panel h2 { margin: 0; font-size: 24px; line-height: 1.14; font-weight: 800; }
    .panel p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      border: 2px solid rgba(0, 0, 0, 0.08);
      font-size: 15px;
      line-height: 1.3;
      font-weight: 700;
      color: #42557c;
    }
    .note {
      background: #f3f0ff;
      border: 2px solid #d9cef8;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .note h2 { margin: 0; font-size: 22px; line-height: 1.14; font-weight: 800; }
    .note p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="860">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Transformar y evaluar no son la misma tarea</h1>
            <p>Una cosa es cambiar la forma del contenido y otra muy distinta es juzgar si está bien, si es cierto o qué calidad tiene.</p>
          </div>

          <div class="split">
            <section class="panel transform">
              <h2>Transformar</h2>
              <p>Sirve para cambiar idioma, estilo, audiencia, longitud o tono sin perder la intención principal del mensaje.</p>
              <div class="stack">
                <div class="item">Traducir con opciones literales e idiomáticas y luego preguntar cuál es la más común.</div>
                <div class="item">Reformular un texto difícil para una audiencia más amplia o con vocabulario más simple.</div>
                <div class="item">Pedir revisión de claridad, tono o estructura antes de publicar o entregar.</div>
              </div>
            </section>

            <section class="panel evaluate">
              <h2>Evaluar</h2>
              <p>Sirve para verificar, puntuar o justificar un juicio, siempre que haya criterios claros y alguna forma de contrastar.</p>
              <div class="stack">
                <div class="item">Verificación de hechos apoyada en fuentes o citas, no solo en tono convincente.</div>
                <div class="item">Calificación numérica cuando defines la escala o la rúbrica de evaluación.</div>
                <div class="item">Retroalimentación cualitativa cuando pides razones, fortalezas, debilidades y mejoras.</div>
              </div>
            </section>
          </div>

          <section class="note">
            <h2>Mejor práctica</h2>
            <p>Cuando traduzcas o reescribas, conviene pedir alternativas y explicaciones. Cuando evalúes, conviene pedir el criterio y revisar si la evidencia realmente sostiene esa nota o ese juicio.</p>
          </section>

          <section class="takeaway">
            <p>Transformar cambia la forma; evaluar emite un juicio. Mezclarlas sin criterio suele producir respuestas bonitas pero poco confiables.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
