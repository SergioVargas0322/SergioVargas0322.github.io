<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Segmentación de imágenes y máscara</title>
  <desc id="desc">Proceso de segmentación con imagen original, máscara binaria y recomposición para desenfocar el fondo sin perder nitidez en el sujeto.</desc>
  <foreignObject x="0" y="0" width="1200" height="980">
    <div xmlns="http://www.w3.org/1999/xhtml" class="page">
      <style>
        * { box-sizing: border-box; }
        .page {
          width: 1200px;
          height: 980px;
          padding: 36px;
          background: linear-gradient(135deg, #eef2ff 0%, #f8fbff 48%, #fff5ea 100%);
          font-family: "Segoe UI", Tahoma, sans-serif;
        }
        .frame {
          height: 100%;
          padding: 32px 36px;
          border-radius: 30px;
          border: 3px solid #d9dff0;
          background: rgba(255, 255, 255, 0.96);
          display: flex;
          flex-direction: column;
          gap: 18px;
        }
        h1, h2, p { margin: 0; }
        h1 {
          color: #1d2c52;
          font-size: 42px;
          line-height: 1.05;
        }
        .lead {
          color: #55657f;
          font-size: 19px;
          line-height: 1.36;
          font-weight: 600;
          max-width: 1030px;
        }
        .pipeline {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 18px;
        }
        .card {
          padding: 20px;
          border-radius: 24px;
          border: 2px solid;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }
        .c1 { background: #eef8f9; border-color: #c4dde0; }
        .c2 { background: #f5f1ff; border-color: #d8cdf3; }
        .c3 { background: #fff5ea; border-color: #e6cfb2; }
        .thumb {
          height: 212px;
          border-radius: 18px;
          border: 2px solid rgba(31, 48, 78, 0.09);
          overflow: hidden;
          position: relative;
          background: #fff;
        }
        .bg {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(circle at 20% 22%, rgba(255,255,255,0.75) 0 14%, transparent 15%),
            linear-gradient(180deg, #c7e5ff 0%, #eef8ff 48%, #dcefd9 48%, #dcefd9 100%);
        }
        .subject {
          position: absolute;
          left: 88px;
          top: 28px;
          width: 82px;
          height: 156px;
          border-radius: 44px 44px 20px 20px;
          background: #314768;
        }
        .subject::before {
          content: "";
          position: absolute;
          width: 58px;
          height: 58px;
          left: 12px;
          top: -24px;
          border-radius: 999px;
          background: #314768;
        }
        .mask .bg { background: #1c2740; }
        .mask .subject, .mask .subject::before { background: #fff; }
        .result .bg { filter: blur(8px); transform: scale(1.03); }
        .result .subject, .result .subject::before { box-shadow: 0 0 0 3px rgba(255,255,255,0.35); }
        .card h2 {
          color: #203253;
          font-size: 27px;
        }
        .card p {
          color: #51637c;
          font-size: 17px;
          line-height: 1.38;
          font-weight: 600;
        }
        .notes {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 14px;
        }
        .note {
          padding: 16px 18px;
          border-radius: 22px;
          border: 2px solid;
        }
        .n1 { background: #eef2ff; border-color: #cad3f2; }
        .n2 { background: #eef9f3; border-color: #cadfce; }
        .note h2 {
          color: #203253;
          font-size: 23px;
          margin-bottom: 8px;
        }
        .note p {
          color: #51637c;
          font-size: 17px;
          line-height: 1.34;
          font-weight: 600;
        }
        .footer {
          margin-top: auto;
          padding: 18px 22px;
          border-radius: 24px;
          background: #203052;
          color: #fff;
        }
        .footer h2 {
          font-size: 24px;
          margin-bottom: 8px;
        }
        .footer p {
          color: #edf2ff;
          font-size: 17px;
          line-height: 1.36;
          font-weight: 600;
        }
      </style>
      <div class="frame">
        <h1>Segmentar es decidir píxel por píxel</h1>
        <p class="lead">En un efecto retrato o en una edición selectiva no basta con saber que hay una persona. El sistema necesita determinar exactamente qué píxeles pertenecen al sujeto y cuáles pertenecen al fondo.</p>
        <div class="pipeline">
          <div class="card c1">
            <div class="thumb">
              <div class="bg"></div>
              <div class="subject"></div>
            </div>
            <h2>Imagen original</h2>
            <p>La foto contiene sujeto y fondo mezclados en una misma matriz de píxeles. A simple vista se ven unidos, pero el software necesita separarlos.</p>
          </div>
          <div class="card c2">
            <div class="thumb mask">
              <div class="bg"></div>
              <div class="subject"></div>
            </div>
            <h2>Máscara</h2>
            <p>La segmentación produce una máscara binaria. El valor indica qué píxel pertenece al sujeto y qué píxel queda fuera de la región seleccionada.</p>
          </div>
          <div class="card c3">
            <div class="thumb result">
              <div class="bg"></div>
              <div class="subject"></div>
            </div>
            <h2>Composición final</h2>
            <p>Al desenfocar el fondo y volver a superponer el sujeto, se logra el efecto retrato sin arrastrar un borde borroso alrededor de la figura principal.</p>
          </div>
        </div>
        <div class="notes">
          <div class="note n1">
            <h2>Por qué no se desenfoca solo el borde</h2>
            <p>El desenfoque mezcla píxeles vecinos. Si se aplicara directamente sobre la frontera entre sujeto y fondo, terminaría contaminando el contorno del sujeto.</p>
          </div>
          <div class="note n2">
            <h2>Qué habilita esta técnica</h2>
            <p>La misma máscara puede servir para resaltar, recortar, borrar, pixelar, reemplazar fondos o seguir objetos dentro de un video.</p>
          </div>
        </div>
        <div class="footer">
          <h2>Idea central</h2>
          <p>La segmentación no trabaja con cajas generales, sino con pertenencia exacta a nivel de píxel. Esa precisión es la que hace posibles las ediciones visuales más finas.</p>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
