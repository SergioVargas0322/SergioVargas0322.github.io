<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: generar ideas</title>
  <desc id="desc">Infografía sobre pedir varias ideas, analizar un ejemplo y usar roles o contexto personal para obtener propuestas más útiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef4ff"/>
      <stop offset="100%" stop-color="#fff8ef"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 930px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 160px;
    }
    .card h2 { margin: 0; font-size: 20px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .c3 { background: #fff5ea; border: 2px solid #efc89b; }
    .c4 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .loop {
      background: #fff5ea;
      border: 2px solid #efc89b;
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .loop h2 { margin: 0; font-size: 24px; line-height: 1.14; font-weight: 800; }
    .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .step {
      background: #fff;
      border: 2px solid #f1d3b0;
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step strong { font-size: 18px; line-height: 1.12; font-weight: 800; color: #d88021; }
    .step span { font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="820">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Para idear mejor, pide opciones y luego afina</h1>
            <p>El chatbot sirve mejor como generador de posibilidades que como adivinador de la única idea perfecta en el primer intento.</p>
          </div>

          <div class="grid">
            <article class="card c1">
              <h2>Pide varias opciones</h2>
              <p>Usar plural obliga a abrir el espacio creativo y evita que todo dependa de una sola sugerencia.</p>
            </article>
            <article class="card c2">
              <h2>Analiza un ejemplo</h2>
              <p>Si algo te gusta, pide que explique por qué funciona y qué patrón está usando.</p>
            </article>
            <article class="card c3">
              <h2>Genera variantes</h2>
              <p>Después de entender el patrón, pide nuevas ideas con la misma estructura, tono o tipo de giro.</p>
            </article>
            <article class="card c4">
              <h2>Da rol y contexto</h2>
              <p>Un rol, intereses personales, valores o pronombres hacen que la propuesta sea menos genérica.</p>
            </article>
          </div>

          <section class="loop">
            <h2>Bucle útil para creatividad</h2>
            <div class="steps">
              <div class="step">
                <strong>1. Abrir</strong>
                <span>Pide varias ideas, no una sola, y deja claro el tipo de salida que buscas.</span>
              </div>
              <div class="step">
                <strong>2. Entender</strong>
                <span>Haz que explique por qué una opción funciona o qué recurso creativo está usando.</span>
              </div>
              <div class="step">
                <strong>3. Recombinar</strong>
                <span>Pide nuevas versiones usando ese mismo mecanismo, pero con otro tema o contexto.</span>
              </div>
            </div>
          </section>

          <section class="takeaway">
            <p>Para ideas, el chatbot rinde mejor como compañero de iteración que como máquina de respuestas finales.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
