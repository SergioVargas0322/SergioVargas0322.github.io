<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Chatbots: herramientas y multimodalidad</title>
  <desc id="desc">Infografía sobre uso de herramientas externas, asistentes personales, generación de imágenes y prompts que combinan imagen y texto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eef8ff"/>
      <stop offset="100%" stop-color="#fff7ee"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" rx="32" fill="url(#bg)"/>
  <style>
    .fo-root, .fo-root * { box-sizing: border-box; }
    .fo-root {
      width: 100%;
      height: 100%;
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      color: #273a69;
    }
    .canvas { width: 100%; height: 100%; padding: 34px; }
    .shell {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #cbd6f6;
      border-radius: 28px;
      padding: 30px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .heading { display: flex; flex-direction: column; gap: 10px; }
    .heading h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 800; }
    .heading p { margin: 0; max-width: 950px; font-size: 18px; line-height: 1.34; font-weight: 600; color: #5b6f95; }
    .top-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .card {
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 170px;
    }
    .card h2 { margin: 0; font-size: 20px; line-height: 1.12; font-weight: 800; }
    .card p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .c1 { background: #eef8ff; border: 2px solid #b7dce8; }
    .c2 { background: #f3f0ff; border: 2px solid #d9cef8; }
    .c3 { background: #fff5ea; border: 2px solid #efc89b; }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .panel {
      border-radius: 24px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .p1 { background: #eef9f1; border: 2px solid #b8dfc3; }
    .p2 { background: #f6f8fb; border: 2px solid #d9dfeb; }
    .panel h2 { margin: 0; font-size: 22px; line-height: 1.14; font-weight: 800; }
    .panel p { margin: 0; font-size: 15px; line-height: 1.32; font-weight: 600; color: #42557c; }
    .takeaway {
      margin-top: auto;
      background: #283a66;
      border-radius: 22px;
      padding: 20px 24px;
      color: #fff;
      text-align: center;
    }
    .takeaway p { margin: 0; font-size: 20px; line-height: 1.28; font-weight: 800; }
  </style>
  <foreignObject x="0" y="0" width="1200" height="860">
    <div xmlns="http://www.w3.org/1999/xhtml" class="fo-root">
      <div class="canvas">
        <div class="shell">
          <div class="heading">
            <h1>Un chatbot también puede apoyarse en otras herramientas</h1>
            <p>Web, código, asistentes personales, imágenes y entradas multimodales amplían lo que parece ser “solo texto”, pero cada capa añade nuevas condiciones de uso.</p>
          </div>

          <div class="top-grid">
            <article class="card c1">
              <h2>Herramientas externas</h2>
              <p>Buscar en la web, escribir código o llamar funciones ayuda a pasar del texto a tareas más concretas y repetibles.</p>
            </article>
            <article class="card c2">
              <h2>Asistentes personales</h2>
              <p>Calendario, mensajes, mapas o recordatorios combinan voz, lenguaje y apps del teléfono.</p>
            </article>
            <article class="card c3">
              <h2>Generación de imágenes</h2>
              <p>La imagen no la produce el LLM por sí solo: suele llamar a un modelo aparte, como uno de difusión.</p>
            </article>
          </div>

          <div class="bottom-grid">
            <section class="panel p1">
              <h2>Prompts con imagen + texto</h2>
              <p>Primero conviene pedir qué se ve y qué texto aparece en la imagen, y después la tarea concreta: describir, traducir, clasificar, comparar o decidir algo.</p>
            </section>
            <section class="panel p2">
              <h2>El contexto visual también sesga</h2>
              <p>El fondo, el ángulo o el soporte pueden cambiar la interpretación. La misma comida sobre otra superficie puede parecer otra cosa.</p>
            </section>
          </div>

          <section class="takeaway">
            <p>Cuantas más herramientas e inputs combines, más importante es separar qué parte interpreta el modelo y qué parte ejecuta otra tecnología.</p>
          </section>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
