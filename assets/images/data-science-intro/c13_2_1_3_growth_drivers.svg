<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Qué impulsa el crecimiento de datos</title>
  <desc id="desc">Resume los principales factores que impulsan el crecimiento de los datos y por qué habilitan más recomendaciones y predicciones.</desc>
  <rect width="1200" height="690" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="634">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:634px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">El crecimiento no es accidental: tiene impulsores claros</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Cada tecnología conectada multiplica eventos medibles. Por eso el crecimiento de datos también amplía la capacidad de recomendar, comparar y predecir.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:16px;background:#edf6f3;display:flex;flex-direction:column;gap:8px;min-height:210px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">IoT</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Más sensores y activos conectados producen telemetría continua.</p>
        </section>
        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:16px;background:#fbf4e8;display:flex;flex-direction:column;gap:8px;min-height:210px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Internet y banda ancha</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Más acceso significa más transacciones, más consumo digital y más intercambio en tiempo real.</p>
        </section>
        <section style="border:1px solid #c9c8de;border-radius:16px;padding:16px;background:#f2f2fb;display:flex;flex-direction:column;gap:8px;min-height:210px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Smartphones</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">La vida diaria se registra en apps, ubicación, cámara, compras y uso continuo del dispositivo.</p>
        </section>
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px;background:#f7f9fa;display:flex;flex-direction:column;gap:8px;min-height:210px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Redes sociales</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Generan texto, imagen, interacción y señales de comportamiento a gran escala.</p>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px 18px;background:#f7f9fa;">
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Ese nuevo volumen de eventos permite detectar tendencias y sostener recomendaciones o predicciones con más contexto que antes.</p>
        </section>
        <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;display:flex;align-items:center;justify-content:center;">
          <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">A más interacciones digitales, más oportunidades de comparar patrones y automatizar decisiones útiles.</p>
        </section>
      </div>
    </div>
  </foreignObject>
</svg>
