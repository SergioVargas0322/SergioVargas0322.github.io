<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Publicar también es dar contexto</title>
  <desc id="desc">Formas de publicar un portafolio en sitio web, GitHub y blog con contexto profesional.</desc>
  <style>
    .bg{fill:#eef6fb}.frame{fill:#fff;stroke:#d6e4f2;stroke-width:2.5}.sheet{font-family:"Segoe UI",Arial,sans-serif;color:#23395b}
    .title{font-size:28px;font-weight:800;line-height:1.15;margin:0}.lead{font-size:15px;line-height:1.45;color:#516b8c;margin:0}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:2px solid #d7e4f2;border-radius:22px;padding:18px 20px;background:#fff;display:flex;flex-direction:column;gap:12px;min-height:260px}
    .a{background:#eef9f9;border-color:#cfe8e8}.b{background:#fff6ea;border-color:#ecd4b0}.c{background:#f5f1ff;border-color:#d9cff7}
    h2{margin:0;font-size:19px;line-height:1.2} p,li{margin:0;font-size:15px;line-height:1.45;color:#39516f} ul{margin:0;padding-left:20px;display:grid;gap:8px}
    .footer{background:#54867f;color:#fff;border-radius:18px;padding:16px 22px;font-size:17px;font-weight:700;line-height:1.35}
  </style>
  <rect class="bg" width="1200" height="760" rx="24"/>
  <rect class="frame" x="24" y="22" width="1152" height="716" rx="28"/>
  <foreignObject x="44" y="42" width="1112" height="676">
    <div xmlns="http://www.w3.org/1999/xhtml" class="sheet" style="height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:22px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 class="title">Publicar también es dar contexto</h1>
        <p class="lead">No basta con subir archivos. Conviene organizar los proyectos de forma que quien los vea entienda qué hiciste, por qué lo hiciste y cómo ponerse en contacto contigo.</p>
      </div>
      <div class="grid">
        <section class="card a">
          <h2>Sitio web personal</h2>
          <ul>
            <li>presenta quién eres y qué te interesa</li>
            <li>ordena proyectos y deja datos de contacto</li>
            <li>funciona como portada profesional</li>
          </ul>
        </section>
        <section class="card b">
          <h2>Repositorio público</h2>
          <ul>
            <li>muestra código, estructura y pasos del proceso</li>
            <li>ayuda a compartir datasets, notebooks y documentación</li>
            <li>permite ver trabajo en progreso y evolución real</li>
          </ul>
        </section>
        <section class="card c">
          <h2>Blog o notas</h2>
          <ul>
            <li>explica motivaciones, hallazgos y aprendizajes</li>
            <li>agrega una voz propia y más contexto humano</li>
            <li>vuelve el portafolio más memorable y menos genérico</li>
          </ul>
        </section>
      </div>
      <div class="footer">Publicar procesos, preguntas y decisiones hace que el portafolio sea más creíble que una colección silenciosa de archivos sueltos.</div>
    </div>
  </foreignObject>
</svg>
