<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Selección de visualización</title>
  <desc id="desc">Guía para elegir la visualización adecuada según el tipo de pregunta analítica.</desc>
  <rect width="1200" height="680" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="624">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:624px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:14px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">La pregunta define la visualización</h1>
        <p style="margin:0;max-width:940px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Antes de elegir un gráfico conviene decidir qué quieres mostrar: cambio, comparación, composición o relación.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:18px;background:#edf6f3;display:flex;flex-direction:column;gap:8px;min-height:136px;">
          <h2 style="margin:0;font-size:23px;line-height:1.1;font-weight:700;">¿Quieres ver tendencia?</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Usa líneas cuando el tiempo importa y necesitas seguir subidas, caídas o estabilidad a lo largo de varios puntos.</p>
        </section>

        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:18px;background:#fbf4e8;display:flex;flex-direction:column;gap:8px;min-height:136px;">
          <h2 style="margin:0;font-size:23px;line-height:1.1;font-weight:700;">¿Quieres comparar categorías?</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Usa barras o columnas cuando la tarea es contrastar valores entre grupos, países, productos o personas.</p>
        </section>

        <section style="border:1px solid #c9c8de;border-radius:16px;padding:18px;background:#f2f2fb;display:flex;flex-direction:column;gap:8px;min-height:136px;">
          <h2 style="margin:0;font-size:23px;line-height:1.1;font-weight:700;">¿Quieres mostrar partes de un total?</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Un circular sirve solo cuando hay pocas categorías y todas juntas representan el 100 % del total.</p>
        </section>

        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:8px;min-height:136px;">
          <h2 style="margin:0;font-size:23px;line-height:1.1;font-weight:700;">¿Quieres ver relación o dispersión?</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Un gráfico de dispersión ayuda a detectar correlaciones, agrupamientos y valores atípicos entre dos variables.</p>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px 18px;background:#f7f9fa;">
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">También importa cuántas variables tienes, cuántos puntos vas a mostrar y si necesitas leer tiempo, proporciones o relación entre medidas.</p>
        </section>
        <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;display:flex;align-items:center;justify-content:center;">
          <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">No existe un gráfico “mejor” en abstracto; existe uno que responde mejor a la pregunta correcta.</p>
        </section>
      </div>
    </div>
  </foreignObject>
</svg>
