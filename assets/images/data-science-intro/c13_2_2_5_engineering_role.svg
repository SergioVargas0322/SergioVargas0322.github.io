<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Rol de la ingeniería de datos</title>
  <desc id="desc">Muestra cómo la ingeniería de datos conecta fuentes, canalización, seguridad y acceso para analistas y modelos.</desc>
  <rect width="1200" height="700" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="644">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:644px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">La ingeniería de datos conecta todo lo demás</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">La canalización no se sostiene sola. Alguien debe elegir herramientas, automatizar flujos, mantener seguridad y asegurar que los datos correctos lleguen al usuario correcto.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:16px;background:#edf6f3;display:flex;flex-direction:column;gap:8px;min-height:230px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Diseñar</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">elegir arquitectura, herramientas y puntos de control</p>
        </section>
        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:16px;background:#fbf4e8;display:flex;flex-direction:column;gap:8px;min-height:230px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Automatizar</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">ejecutar flujos repetibles y confiables sin trabajo manual frágil</p>
        </section>
        <section style="border:1px solid #c9c8de;border-radius:16px;padding:16px;background:#f2f2fb;display:flex;flex-direction:column;gap:8px;min-height:230px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Proteger</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">garantizar acceso correcto, seguridad y continuidad operativa</p>
        </section>
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px;background:#f7f9fa;display:flex;flex-direction:column;gap:8px;min-height:230px;">
          <h2 style="margin:0;font-size:22px;line-height:1.1;font-weight:700;">Entregar</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">poner datos consistentes al alcance de analistas, dashboards y modelos</p>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">La administración madura de datos masivos busca repetibilidad, seguridad y claridad, no solo mover datos más rápido.</p>
      </section>
    </div>
  </foreignObject>
</svg>
