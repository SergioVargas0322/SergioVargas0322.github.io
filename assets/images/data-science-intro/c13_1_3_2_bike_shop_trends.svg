<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Tendencias en una tienda de bicicletas</title>
  <desc id="desc">Ejemplo de análisis de tendencias para detectar qué compran los nuevos clientes y en qué temporada.</desc>
  <rect width="1200" height="720" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="664">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:664px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">Las tendencias convierten ventas pasadas en decisiones de campaña</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Si una tienda detecta qué compran los nuevos clientes y en qué época del año lo hacen, ya tiene una base para ajustar publicidad, inventario y evaluación posterior.</p>
      </div>

      <div style="display:grid;grid-template-columns:1.1fr 0.9fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:10px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Lectura de tendencia</h2>
          <div style="height:220px;border:1px solid #dbe3e6;border-radius:12px;background:#ffffff;padding:14px;display:flex;align-items:flex-end;gap:10px;">
            <div style="width:14%;height:28%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
            <div style="width:14%;height:36%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
            <div style="width:14%;height:44%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
            <div style="width:14%;height:74%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
            <div style="width:14%;height:82%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
            <div style="width:14%;height:66%;background:#4f7f76;border-radius:8px 8px 0 0;"></div>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">El pico de nuevos compradores aparece en una temporada concreta y alrededor de ciertos tipos de bicicletas o servicios.</p>
        </section>

        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:10px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Qué decisiones salen de ahí</h2>
          <div style="display:grid;grid-template-columns:1fr;gap:10px;">
            <div style="padding:14px;border-radius:12px;background:#edf6f3;border:1px solid #b7d2cb;font-size:15px;font-weight:700;">Comprar publicidad justo antes del pico</div>
            <div style="padding:14px;border-radius:12px;background:#fbf4e8;border:1px solid #d8c8b1;font-size:15px;font-weight:700;">Reforzar inventario de los productos con mayor entrada</div>
            <div style="padding:14px;border-radius:12px;background:#f2f2fb;border:1px solid #c9c8de;font-size:15px;font-weight:700;">Comparar ventas después de la campaña para medir efectividad</div>
          </div>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">Un KPI observado en el tiempo no solo describe el pasado; también orienta cuándo actuar y cómo medir si funcionó.</p>
      </section>
    </div>
  </foreignObject>
</svg>
