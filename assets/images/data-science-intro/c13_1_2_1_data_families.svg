<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">Familias de datos</title>
  <desc id="desc">Comparación entre datos cualitativos, cuantitativos, discretos y continuos con ejemplos cotidianos.</desc>
  <rect width="1200" height="740" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="684">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:684px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">No todos los datos dicen lo mismo</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Primero conviene separar lo que describe una categoría de lo que mide una cantidad. Después, dentro de lo cuantitativo, distinguir lo que se cuenta de lo que se mide.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:18px;background:#edf6f3;display:flex;flex-direction:column;gap:10px;min-height:186px;">
          <h2 style="margin:0;font-size:25px;line-height:1.1;font-weight:700;">Cualitativos</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Describen atributos, categorías o percepciones. Suelen venir como texto, etiquetas u observaciones.</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">reseñas</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">entrevistas</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">categorías</span>
          </div>
        </section>

        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:18px;background:#fbf4e8;display:flex;flex-direction:column;gap:10px;min-height:186px;">
          <h2 style="margin:0;font-size:25px;line-height:1.1;font-weight:700;">Cuantitativos</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Expresan magnitudes numéricas. Permiten contar, medir, comparar y aplicar operaciones matemáticas.</p>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">ventas</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">temperatura</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">horas</span>
          </div>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <section style="border:1px solid #c9c8de;border-radius:16px;padding:18px;background:#f2f2fb;display:flex;flex-direction:column;gap:10px;min-height:180px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Discretos</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Cuentan unidades separadas. Normalmente toman valores enteros.</p>
          <ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.4;color:#304441;font-weight:600;">
            <li>transacciones por día</li>
            <li>personas que visitan un sitio</li>
            <li>incidentes registrados</li>
          </ul>
        </section>

        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:10px;min-height:180px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Continuos</h2>
          <p style="margin:0;font-size:15px;line-height:1.36;color:#425653;font-weight:600;">Representan mediciones que pueden tomar muchos valores dentro de un rango.</p>
          <ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.4;color:#304441;font-weight:600;">
            <li>distancia recorrida</li>
            <li>temperatura ambiente</li>
            <li>peso, altura o tiempo</li>
          </ul>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">Si mezclas categorías con magnitudes, o conteos con mediciones, eliges mal la métrica y el gráfico desde el inicio.</p>
      </section>
    </div>
  </foreignObject>
</svg>
