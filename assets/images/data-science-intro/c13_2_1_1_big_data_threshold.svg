<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cuándo un conjunto de datos se vuelve masivo</title>
  <desc id="desc">Explica que el big data aparece cuando volumen, velocidad y complejidad superan a las herramientas tradicionales.</desc>
  <rect width="1200" height="700" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="644">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:644px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">Big data empieza cuando lo tradicional deja de alcanzar</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">No basta con decir que hay muchos datos. El problema aparece cuando llegan demasiado rápido, en demasiados formatos o con una complejidad que ya no cabe en un flujo convencional.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:18px;background:#edf6f3;display:flex;flex-direction:column;gap:10px;min-height:240px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Demasiado grande</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">El volumen ya no se maneja con comodidad en almacenamiento y análisis convencionales.</p>
        </section>
        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:18px;background:#fbf4e8;display:flex;flex-direction:column;gap:10px;min-height:240px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Demasiado rápido</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">La información se genera tan deprisa que no sirve esperar a procesarla mucho después.</p>
        </section>
        <section style="border:1px solid #c9c8de;border-radius:16px;padding:18px;background:#f2f2fb;display:flex;flex-direction:column;gap:10px;min-height:240px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Demasiado complejo</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Tablas, texto, video, imágenes, sensores y redes sociales ya no encajan en una sola lógica simple.</p>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px 18px;background:#f7f9fa;">
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Ejemplos típicos: publicaciones de redes sociales, tráfico de e-commerce, telemetría de IoT, mercados financieros y flujos de actividad en tiempo real.</p>
        </section>
        <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;display:flex;align-items:center;justify-content:center;">
          <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">El tamaño por sí solo no define el problema; lo define la distancia entre la demanda del dato y la capacidad del sistema.</p>
        </section>
      </div>
    </div>
  </foreignObject>
</svg>
