<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Selección de datos relevantes</title>
  <desc id="desc">Ejemplo de selección de datos relevantes a partir de una pregunta concreta sobre bienestar laboral.</desc>
  <rect width="1200" height="690" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="634">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:634px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">Primero la pregunta, luego las variables</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">La relevancia no depende de que un campo exista en la tabla, sino de si ayuda a responder el problema planteado.</p>
      </div>

      <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;">
        <h2 style="margin:0 0 8px;font-size:24px;line-height:1.1;font-weight:700;">Pregunta del análisis</h2>
        <p style="margin:0;font-size:16px;line-height:1.38;color:#425653;font-weight:600;">¿Qué factores pueden estar afectando el bienestar general de la fuerza laboral?</p>
      </section>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:18px;background:#edf6f3;display:flex;flex-direction:column;gap:10px;min-height:228px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Campos más relevantes</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">promedio de horas semanales</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">ausentismo</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">rotación</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #cfe0db;font-size:14px;font-weight:700;">carga de trabajo</span>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Estos campos se conectan con la pregunta porque podrían explicar estrés, agotamiento o presión operativa.</p>
        </section>

        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:18px;background:#fbf4e8;display:flex;flex-direction:column;gap:10px;min-height:228px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Campos menos relevantes</h2>
          <div style="display:flex;flex-wrap:wrap;gap:8px;">
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">fecha de contratación</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">número de extensión</span>
            <span style="padding:8px 10px;border-radius:999px;background:#ffffff;border:1px solid #ead8bc;font-size:14px;font-weight:700;">ID interno</span>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Pueden ser útiles para otras preguntas, pero aquí no ayudan directamente a explicar bienestar y pueden introducir ruido.</p>
        </section>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px 18px;background:#f7f9fa;">
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">Recolectar todo no vuelve mejor el análisis. Una buena selección reduce costo, simplifica limpieza y mantiene el foco en la decisión.</p>
        </section>
        <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;display:flex;align-items:center;justify-content:center;">
          <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">La relevancia no está en la tabla: está en la relación entre la variable y la pregunta.</p>
        </section>
      </div>
    </div>
  </foreignObject>
</svg>
