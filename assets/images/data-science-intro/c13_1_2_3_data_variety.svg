<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Variedad de datos</title>
  <desc id="desc">Panorama de la variedad de formatos de datos modernos y su expansión desde dispositivos móviles.</desc>
  <rect width="1200" height="680" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="624">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:624px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">La variedad crece más rápido que el formato</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Los datos ya no llegan solo como números en una tabla. Teléfonos, sensores y plataformas generan texto, audio, video, documentos, logs e imágenes al mismo tiempo.</p>
      </div>

      <div style="display:grid;grid-template-columns:0.95fr 1.05fr;gap:14px;">
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:12px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Del teléfono básico al ecosistema actual</h2>
          <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;">
            <div style="padding:14px;border-radius:12px;background:#ffffff;border:1px solid #dbe3e6;">
              <strong style="font-size:16px;">Antes</strong>
              <p style="margin:6px 0 0;font-size:15px;line-height:1.35;color:#425653;font-weight:600;">mensajes, algunos MP3 y fotos de baja resolución</p>
            </div>
            <div style="padding:14px;border-radius:12px;background:#ffffff;border:1px solid #dbe3e6;">
              <strong style="font-size:16px;">Hoy</strong>
              <p style="margin:6px 0 0;font-size:15px;line-height:1.35;color:#425653;font-weight:600;">video HD, audio, documentos, apps, correos, calendarios y mucho más</p>
            </div>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">El crecimiento no es solo de volumen; también es de variedad. Esa mezcla obliga a pensar en distintos flujos de almacenamiento y análisis.</p>
        </section>

        <section style="border:1px solid #d7dee3;border-radius:16px;padding:18px;background:#f7f9fa;display:flex;flex-direction:column;gap:10px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Formatos que hoy conviven</h2>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
            <div style="padding:14px;border-radius:12px;background:#edf6f3;border:1px solid #b7d2cb;font-size:15px;font-weight:700;">texto y reseñas</div>
            <div style="padding:14px;border-radius:12px;background:#fbf4e8;border:1px solid #d8c8b1;font-size:15px;font-weight:700;">audio y voz</div>
            <div style="padding:14px;border-radius:12px;background:#f2f2fb;border:1px solid #c9c8de;font-size:15px;font-weight:700;">video e imagen</div>
            <div style="padding:14px;border-radius:12px;background:#eef6ee;border:1px solid #c8dfc8;font-size:15px;font-weight:700;">sensores y telemetría</div>
            <div style="padding:14px;border-radius:12px;background:#f7f9fa;border:1px solid #d7dee3;font-size:15px;font-weight:700;">documentos y PDF</div>
            <div style="padding:14px;border-radius:12px;background:#fff8ea;border:1px solid #ead8bc;font-size:15px;font-weight:700;">logs y apps</div>
          </div>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">La fuente y el formato condicionan limpieza, almacenamiento, búsqueda y aprovechamiento posterior.</p>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">Trabajar con datos modernos implica asumir que no todos llegan listos para una hoja de cálculo.</p>
      </section>
    </div>
  </foreignObject>
</svg>
