<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">IA en agricultura</title>
  <desc id="desc">Proyecto agrícola que usa imágenes y GPS para distinguir malas hierbas de cultivos y reducir herbicidas.</desc>
  <rect width="1200" height="720" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="664">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:664px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">Un caso real: distinguir cultivo y maleza con visión artificial</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">La IA agrícola no necesita parecer futurista. Ya aporta valor cuando combina imágenes y GPS para decidir dónde intervenir y reducir químicos innecesarios.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:16px;background:#edf6f3;display:flex;flex-direction:column;gap:8px;min-height:240px;">
          <h2 style="margin:0;font-size:21px;line-height:1.1;font-weight:700;">Captura</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">imágenes del terreno y coordenadas GPS</p>
        </section>
        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:16px;background:#fbf4e8;display:flex;flex-direction:column;gap:8px;min-height:240px;">
          <h2 style="margin:0;font-size:21px;line-height:1.1;font-weight:700;">Entrenamiento</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">modelo que aprende a reconocer diferencias entre planta útil y maleza</p>
        </section>
        <section style="border:1px solid #c9c8de;border-radius:16px;padding:16px;background:#f2f2fb;display:flex;flex-direction:column;gap:8px;min-height:240px;">
          <h2 style="margin:0;font-size:21px;line-height:1.1;font-weight:700;">Decisión</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">detectar dónde aplicar tratamiento y dónde no</p>
        </section>
        <section style="border:1px solid #d7dee3;border-radius:16px;padding:16px;background:#f7f9fa;display:flex;flex-direction:column;gap:8px;min-height:240px;">
          <h2 style="margin:0;font-size:21px;line-height:1.1;font-weight:700;">Impacto</h2>
          <p style="margin:0;font-size:15px;line-height:1.38;color:#425653;font-weight:600;">menos herbicidas, acción más precisa y mejor uso de recursos</p>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">Aquí la IA no reemplaza al agricultor: amplía su capacidad para detectar patrones en datos no estructurados.</p>
      </section>
    </div>
  </foreignObject>
</svg>
