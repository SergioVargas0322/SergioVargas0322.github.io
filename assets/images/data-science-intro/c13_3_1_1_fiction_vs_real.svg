<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">IA: ficción y realidad</title>
  <desc id="desc">Contrasta la idea de inteligencia artificial general con las tareas específicas que hoy sí resuelven los modelos reales.</desc>
  <rect width="1200" height="690" fill="#f4f7f6"/>
  <foreignObject x="28" y="28" width="1144" height="634">
    <div xmlns="http://www.w3.org/1999/xhtml" style="height:634px;box-sizing:border-box;border:1px solid #c8d7d3;border-radius:18px;background:#ffffff;padding:28px 30px;font-family:Arial,sans-serif;color:#203330;display:flex;flex-direction:column;justify-content:space-between;gap:16px;">
      <div style="display:flex;flex-direction:column;gap:10px;">
        <h1 style="margin:0;font-size:34px;line-height:1.08;font-weight:700;">La IA real no se parece mucho a la de las películas</h1>
        <p style="margin:0;max-width:980px;font-size:18px;line-height:1.35;color:#4c615d;font-weight:600;">Lo que suele llamarse IA hoy no es una mente general. Son sistemas entrenados para resolver tareas concretas con datos, objetivos y límites bastante definidos.</p>
      </div>

      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px;">
        <section style="border:1px solid #d8c8b1;border-radius:16px;padding:18px;background:#fbf4e8;display:flex;flex-direction:column;gap:10px;min-height:280px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Ficción</h2>
          <ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.42;color:#304441;font-weight:600;">
            <li>inteligencia general casi ilimitada</li>
            <li>robots autónomos que entienden todo</li>
            <li>decisiones sin contexto ni supervisión</li>
          </ul>
        </section>
        <section style="border:1px solid #b7d2cb;border-radius:16px;padding:18px;background:#edf6f3;display:flex;flex-direction:column;gap:10px;min-height:280px;">
          <h2 style="margin:0;font-size:24px;line-height:1.1;font-weight:700;">Realidad</h2>
          <ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.42;color:#304441;font-weight:600;">
            <li>clasificar, recomendar o reconocer patrones</li>
            <li>apoyar decisiones repetitivas con muchos datos</li>
            <li>necesitar entrenamiento, límites y revisión humana</li>
          </ul>
        </section>
      </div>

      <section style="border:1px solid #4f7f76;border-radius:16px;padding:18px;background:#4f7f76;color:#ffffff;text-align:center;">
        <p style="margin:0;font-size:20px;line-height:1.28;font-weight:700;">Separar ficción de realidad ayuda a usar la IA con criterio, sin miedo exagerado ni expectativas irreales.</p>
      </section>
    </div>
  </foreignObject>
</svg>
